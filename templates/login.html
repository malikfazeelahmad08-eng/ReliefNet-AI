
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login | ReliefNet AI</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #08131f;
            color: #f4f7fb;
            font-family: 'DM Sans', sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: #142535;
            border: 1px solid #294353;
            border-radius: 20px;
        }

        .brand {
            font: 800 28px Manrope, sans-serif;
            margin-bottom: 10px;
        }

        .brand span { color: #38d6ad; }

        .subtitle {
            color: #a9b8c8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #405466;
            background: #0c1a27;
            color: white;
            outline: none;
        }

        input:focus { border-color: #38d6ad; }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #159b7b;
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 22px;
            color: #38d6ad;
            text-align: center;
            text-decoration: none;
        }

        .flash {
            padding: 12px;
            background: #503039;
            color: #ffd9df;
            border-radius: 8px;
            margin: 12px 0;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="brand">ReliefNet<span>AI</span></div>

        <p class="subtitle">Administrator access portal</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label for="username">Administrator username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
                autocomplete="username"
            >

            <label for="password">Demo password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Access Dashboard →</button>

        </form>

        <a class="back" href="{{ url_for('landing') }}">
            ← Back to Welcome Portal
        </a>

    </div>

</body>
</html>
